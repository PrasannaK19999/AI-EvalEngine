[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-engine"
version = "0.1.0"
description = "An evaluation engine for LLM and RAG outputs."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "datasets>=2.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eval_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
eval-engine = "eval_engine.cli.main:app"